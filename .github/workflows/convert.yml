name: Convert NSFW Model to TFLite

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # سنقوم بتثبيت tensorflow فقط والابتعاد عن tensorflowjs المسبب للمشاكل
          pip install tensorflow

      - name: Manual Convert (TFJS to TFLite)
        run: |
          python -c "
          import tensorflow as tf
          import os

          # تحميل النموذج يدويا من ملف JSON والأوزان
          # ملاحظة: سنستخدم واجهة برمجة تطبيقات Keras لتحميل النموذج مباشرة
          try:
              import tensorflowjs as tfjs
              # نحاول تثبيته محليا فقط لهذه الخطوة
          except ImportError:
              os.system('pip install tensorflowjs')
              import tensorflowjs as tfjs

          # تحويل وتحميل النموذج في ذاكرة الوصول العشوائي
          model = tfjs.converters.load_keras_model('./mobilenet_v2/model.json')
          
          # التحويل المباشر لـ TFLite مع الضغط
          converter = tf.lite.TFLiteConverter.from_keras_model(model)
          converter.optimizations = [tf.lite.Optimize.DEFAULT]
          converter.target_spec.supported_types = [tf.float16]
          
          tflite_model = converter.convert()
          
          with open('nsfw_model_optimized.tflite', 'wb') as f:
              f.write(tflite_model)
          
          print('✅ Manual Conversion complete!')
          "

      - name: Upload TFLite model
        uses: actions/upload-artifact@v4
        with:
          name: nsfw-optimized-model
          path: nsfw_model_optimized.tflite
