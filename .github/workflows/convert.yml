name: Convert NSFW Model to TFLite

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # تثبيت المكتبات بدون فرض إصدار محدد للبروتوباف
          pip install tensorflow tensorflowjs
          # تفعيل المتغير البيئي لإصدار بايثون لتجاوز تعارض الـ C++ runtime
          echo "PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python" >> $GITHUB_ENV

      - name: Convert TFJS to Keras (.h5)
        run: |
          # تفعيل المتغير البيئي في هذه الخطوة أيضاً
          export PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
          if [ -d "./mobilenet_v2" ]; then
            tensorflowjs_converter \
              --input_format=tfjs_layers_model \
              --output_format=keras \
              ./mobilenet_v2 \
              ./nsfw_model.h5
          else
            echo "❌ Error: Directory ./mobilenet_v2 not found!"
            exit 1
          fi

      - name: Convert Keras to TFLite (Optimized)
        run: |
          export PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
          python -c "
          import tensorflow as tf
          import os

          if not os.path.exists('./nsfw_model.h5'):
              print('❌ Error: nsfw_model.h5 was not created!')
              exit(1)

          model = tf.keras.models.load_model('./nsfw_model.h5', compile=False)
          converter = tf.lite.TFLiteConverter.from_keras_model(model)
          
          # تقنيات الضغط لتقليل الحجم
          converter.optimizations = [tf.lite.Optimize.DEFAULT]
          converter.target_spec.supported_types = [tf.float16]
          
          tflite_model = converter.convert()
          
          with open('nsfw_model_optimized.tflite', 'wb') as f:
              f.write(tflite_model)
          
          print('✅ Conversion complete!')
          print(f'Final size: {os.path.getsize(\"nsfw_model_optimized.tflite\") / (1024*1024):.2f} MB')
          "

      - name: Upload TFLite model
        uses: actions/upload-artifact@v4
        with:
          name: nsfw-optimized-model
          path: nsfw_model_optimized.tflite
