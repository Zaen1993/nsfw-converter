name: Convert NSFW Model to TFLite

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' # استخدمنا 3.9 لثبات أعلى مع النسخ القديمة

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # تثبيت إصدارات محددة جداً لضمان التوافق وتجنب خطأ numpy الأخير
          pip install "numpy<2.0.0" "scipy<1.13.0"
          pip install tensorflow==2.15.0 tensorflowjs==4.17.0
          # حل مشكلة البروتوباف التي واجهتنا في البداية
          echo "PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python" >> $GITHUB_ENV

      - name: Manual Convert (TFJS to TFLite)
        run: |
          export PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
          python -c "
          import os
          # فرض إصدار numpy قبل استدعاء أي مكتبة أخرى
          import numpy as np
          print(f'Using Numpy version: {np.__version__}')
          
          import tensorflow as tf
          import tensorflowjs as tfjs

          try:
              # تحميل النموذج مباشرة من ملفات TFJS
              model = tfjs.converters.load_keras_model('./mobilenet_v2/model.json')
              
              # إعداد المحول لـ TFLite
              converter = tf.lite.TFLiteConverter.from_keras_model(model)
              converter.optimizations = [tf.lite.Optimize.DEFAULT]
              converter.target_spec.supported_types = [tf.float16]
              
              tflite_model = converter.convert()
              
              with open('nsfw_model_optimized.tflite', 'wb') as f:
                  f.write(tflite_model)
              
              print('✅ Success: Optimized TFLite model generated!')
          except Exception as e:
              print(f'❌ Failed during conversion: {str(e)}')
              exit(1)
          "

      - name: Upload TFLite model
        uses: actions/upload-artifact@v4
        with:
          name: nsfw-optimized-model
          path: nsfw_model_optimized.tflite
